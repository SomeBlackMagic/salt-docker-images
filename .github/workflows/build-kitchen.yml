# -*- coding: utf-8 -*-
# vim: ft=yaml
---
name: Build Kitchen Images

'on':
  workflow_dispatch:
    inputs:
      salt_versions:
        description: 'Comma-separated Salt versions (e.g. "3006.9,3006.14,3007.1")'
        required: true
        default: '3006.9'
      force_rebuild:
        description: 'Force rebuild even if image already exists in registry'
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'salt-kitchen/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  prepare:
    name: Prepare version matrix
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.set-matrix.outputs.versions }}
    steps:
      - name: Set matrix
        id: set-matrix
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT="${{ github.event.inputs.salt_versions }}"
          else
            INPUT="3006.9"
          fi
          JSON=$(echo "$INPUT" | jq -R -c 'split(",") | map(gsub("^\\s+|\\s+$";""))')
          echo "versions=$JSON" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }} (${{ matrix.salt_version }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        salt_version: ${{ fromJson(needs.prepare.outputs.versions) }}
        platform:
          - kitchen-debian-12
          - kitchen-ubuntu-2204
          - kitchen-ubuntu-2404
          - kitchen-rockylinux-9
          - kitchen-amazonlinux-2023
          - kitchen-centos-stream-9
          - kitchen-almalinux-9
          - kitchen-opensuse-leap-15
    steps:
      - name: Check if image already exists
        id: check-image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.platform }}:${{ matrix.salt_version }}"
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image $IMAGE already exists in registry"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Image $IMAGE not found in registry"
          fi

      - name: Skip build (image exists)
        if: steps.check-image.outputs.exists == 'true' && github.event.inputs.force_rebuild != 'true'
        run: echo "Skipping build — image already exists. Use force_rebuild to override."

      - name: Checkout repository
        if: steps.check-image.outputs.exists != 'true' || github.event.inputs.force_rebuild == 'true'
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        if: steps.check-image.outputs.exists != 'true' || github.event.inputs.force_rebuild == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        if: steps.check-image.outputs.exists != 'true' || github.event.inputs.force_rebuild == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.platform }}
          tags: |
            type=raw,value=${{ matrix.salt_version }}
            type=raw,value=${{ matrix.salt_version }}-{{sha}}

      - name: Set up Docker Buildx
        if: steps.check-image.outputs.exists != 'true' || github.event.inputs.force_rebuild == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.platform }}:${{ matrix.salt_version }}
        if: steps.check-image.outputs.exists != 'true' || github.event.inputs.force_rebuild == 'true'
        uses: docker/build-push-action@v6
        with:
          context: salt-kitchen/${{ matrix.platform }}
          push: true
          build-args: |
            SALT_VERSION=${{ matrix.salt_version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.platform }}:${{ matrix.salt_version }}
          cache-to: type=inline
